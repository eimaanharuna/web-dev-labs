<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Car Booking</title>
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <div id="container">
      <header>
        <h1>Book a Car</h1>
      </header>
      <main>
        <section id="form">
          <h2>Contact Us</h2>

          <form action="process.html" method="get" id="booking">
            <div class="form-row">
              <label for="contactname">Name</label>
              <input
              title="Enter a valid name"
                required
                autofocus
                pattern="[A-Z][a-z]+([A-Z][a-z]+)*"
                type="text"
                name="contactname"
                id="contactname"
              >
            </div>
              <div class="form-row">
              <label for="email"> Email Adress: </label>
              <input required title="Enter a valid email address" pattern="[a-z0-9._%+-]+@[a-z0-9.-]{2,}.[a-zA-Z0-9]{2,}" type="email" name="email" id="email">
              </div>
              <fieldset class="check">
                <legend> Do you have a Driver's licence? </legend>

                <label for="Yes">
                  <input type="radio" name="option" id="Yes">Yes</label>
                  <label for="No">
                  <input type="radio" name="option" id="No">No</label>
                  </fieldset>
                  <div class="form-row">
              <label for="age">Age:</label>
              <input required title="Enter a valid age" min="17" max="80" type="text" name="age" id="age">
              </div>
          <div class="form-row">
            <label for="start_date">Booking Date</label>
            <input required title="Enter a valid Booking Date" type="date" name="booking_date" id="booking_date">
          </div>
          <div class="form-row">
            <label for="myCar"> Car </label>
            <input type="text" list="car" name="myCar" id="myCar">
            <datalist id="car">
              <option value="Hyundai Tucson">
                <option value="Toyota Rav4">
                <option value="Ford Focus">
                <option value="Renault Kadjar">
                <option value="Nissan Qashqai">
            </datalist>
          </div>
          <p>
            Please provide any other details you think will be useful to us in the text area below (it may save us calling or emailing you, and help avoid delays).
          </p>
          <div class="form-row">
            <label for="textarea"> More details (as much as you think we'll need!) </label>
            <textarea name="details" id="details"></textarea>
            </div>
            <button type="submit">Submit</button>
            <button type="reset">Clear the info</button>
        </form>
        </section>
        <section id="image">
          <figure>
            <img src="images/car.jfif" alt="Car" class="ui fluid image">
            <figcaption>Car Rental</figcaption>
          </figure>
        </section>
      </main>
    </div>
  </body>
</html>
